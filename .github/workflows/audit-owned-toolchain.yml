name: Audit inherited website toolchain
on:
  push:
    branches: [refactor/proof-state-owned-toolchain]
    paths: [.github/workflows/audit-owned-toolchain.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile > /tmp/install.log 2>&1
      - name: Archive public source and installed wrapper for review
        run: |
          mkdir -p toolchain-audit/wrapper
          git archive HEAD | tar -x -C toolchain-audit
          cp node_modules/@lovable.dev/vite-tanstack-config/dist/index.js toolchain-audit/wrapper/
          cp node_modules/@lovable.dev/vite-tanstack-config/package.json toolchain-audit/wrapper/
          node --input-type=module - <<'JS'
          import { resolveConfig } from 'vite';
          import { writeFileSync } from 'node:fs';
          const c = await resolveConfig({}, 'build', 'production');
          writeFileSync('toolchain-audit/resolved.json', JSON.stringify({plugins:c.plugins.map(p=>p.name),resolve:c.resolve,server:{host:c.server.host,port:c.server.port,strictPort:c.server.strictPort,allowedHosts:c.server.allowedHosts},defineKeys:Object.keys(c.define||{}),build:c.build,ssr:c.ssr},null,2));
          JS
          bun run build > /tmp/build.log 2>&1
          cp .output/server/wrangler.json toolchain-audit/generated-wrangler.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-toolchain-source-audit
          path: toolchain-audit/
          include-hidden-files: true
          retention-days: 30
