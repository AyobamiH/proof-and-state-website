name: Prepare owned toolchain migration
on:
  push:
    branches: [refactor/proof-state-owned-toolchain]
    paths: [.github/workflows/prepare-owned-toolchain.yml, scripts/prepare_owned_once.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refactor/proof-state-owned-toolchain
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Apply audited composition and preserve exact dependency resolutions
        run: |
          python3 scripts/prepare_owned_once.py
          bun install --frozen-lockfile
          bunx prettier --write vite.config.ts tools/vite-diagnostics.ts src/client.tsx src/lib/runtime-diagnostics.ts src/routes/__root.tsx tests/toolchain.test.ts tsconfig.json package.json
          rm scripts/prepare_owned_once.py
          git restore --source=HEAD -- .github/workflows
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add -A
          git commit -m 'Complete owned application toolchain and preserve exact dependency versions'
          git push origin HEAD:refactor/proof-state-owned-toolchain
