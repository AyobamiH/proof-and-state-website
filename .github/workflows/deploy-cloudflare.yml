name: Deploy website to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: proof-and-state-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Require Cloudflare deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source
        run: |
          bun run lint
          bunx tsc --noEmit

      - name: Build Cloudflare Worker
        run: bun run build

      - name: Deploy exact main commit
        run: npx --yes wrangler@4.127.0 deploy --config .output/server/wrangler.json

      - name: Verify canonical production routes
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 18); do
            homepage="$(curl --fail --silent --show-error https://proofandstate.com/ || true)"
            if grep --fixed-strings --quiet "Let AI move faster without losing review." <<<"$homepage" \
              && ! grep --fixed-strings --quiet "AWAITING_VERIFICATION" <<<"$homepage"; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Canonical homepage did not expose the current public product story" >&2
              exit 1
            fi
            sleep 10
          done

          status_page="$(curl --fail --silent --show-error https://proofandstate.com/status)"
          grep --fixed-strings --quiet "Current product reality" <<<"$status_page"
          grep --fixed-strings --quiet "AgentProof" <<<"$status_page"
          grep --fixed-strings --quiet "In development" <<<"$status_page"

          location="$(curl --silent --show-error --head https://www.proofandstate.com/ | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, "", $2); print $2; exit }')"
          test "$location" = "https://proofandstate.com/"
