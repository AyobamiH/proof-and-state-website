name: Prepare reviewed branding assets
on:
  push:
    branches: [fix/verified-site-identity-v1]
permissions:
  contents: write
jobs:
  export:
    if: github.ref == 'refs/heads/fix/verified-site-identity-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/verified-site-identity-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Export static raster assets from the approved mark
        run: |
          python3 -m venv /tmp/branding-export
          /tmp/branding-export/bin/pip install CairoSVG==2.8.2 Pillow==11.3.0
          /tmp/branding-export/bin/python scripts/render_branding.py --update-contract
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          text = subprocess.check_output(['git', 'show', 'b695cb62965a8b22de915c02109fef71422579a0:src/routes/__root.tsx'], text=True)
          text = text.replace('import { GITHUB_URL, SITE_NAME, SITE_URL, SYSTEM_DEFINITION }', 'import { BRAND_LINKS, BRAND_MARK } from "@/content/brand";\nimport { GITHUB_URL, SITE_NAME, SITE_URL, SYSTEM_DEFINITION }', 1)
          start = text.index('      { rel: "icon", href: "/brand/proof-and-state-mark.svg"')
          end = text.index('      { rel: "preconnect"', start)
          text = text[:start] + '      ...BRAND_LINKS,\n' + text[end:]
          text = text.replace('logo: `${SITE_URL}/brand/proof-and-state-mark.svg`,', 'logo: `${SITE_URL}${BRAND_MARK}`,')
          Path('src/routes/__root.tsx').write_text(text)
          PY
          bun install --frozen-lockfile
          bunx prettier --write src/content/brand.ts src/routes/__root.tsx src/lib/seo.ts
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_branding.py --assets public
          bun run lint
          bunx tsc --noEmit
      - name: Commit exports on the isolated branch and remove this one-shot workflow
        run: |
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add public/brand/v1 public/apple-touch-icon.png public/apple-touch-icon-precomposed.png scripts/branding-contract.json src/content/brand.ts src/routes/__root.tsx src/lib/seo.ts
          git rm .github/workflows/prepare-branding-assets.yml
          git commit -m 'Export approved Proof & State identity assets and pin acceptance hashes'
          git push origin HEAD:fix/verified-site-identity-v1
