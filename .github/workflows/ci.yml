name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: |
          set -o pipefail
          mkdir -p branding-evidence
          bun run lint 2>&1 | tee branding-evidence/lint.log
      - name: Type-check
        run: |
          set -o pipefail
          bunx tsc --noEmit 2>&1 | tee branding-evidence/types.log
      - name: Owned toolchain unit tests
        run: |
          set -o pipefail
          bun run test:toolchain 2>&1 | tee branding-evidence/unit-tests.log
      - name: Branding regression tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_branding.py --assets public --report branding-evidence/source.json
      - name: Build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee branding-evidence/build.log
      - name: Verify built Worker and owned toolchain before merge
        run: |
          python3 scripts/verify_toolchain.py --built --report branding-evidence/toolchain.json
          bash scripts/check_built_branding.sh
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branding-ci-${{ github.run_id }}
          path: branding-evidence/
          retention-days: 30
