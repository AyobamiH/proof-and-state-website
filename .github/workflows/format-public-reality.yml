name: Format public reality

on:
  push:
    branches:
      - fix/public-reality-surface

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-reality-surface
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply repository formatting
        run: >-
          bunx prettier --write
          src/components/ps/footer.tsx
          src/components/ps/product-detail.tsx
          src/components/ps/product-modules.tsx
          src/components/ps/specimens.tsx
          src/content/products.ts
          src/content/site.ts
          src/routes/about.tsx
          src/routes/changelog.tsx
          src/routes/contact.tsx
          src/routes/donestate.tsx
          src/routes/index.tsx
          src/routes/open-source.tsx
          src/routes/products.agentproof.tsx
          src/routes/products.index.tsx
          src/routes/products.opstruth.tsx
          src/routes/security.tsx
          src/routes/status.tsx
          src/routes/trust.tsx
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ps src/content src/routes
          git commit -m "chore: apply repository formatting"
          git push origin HEAD:fix/public-reality-surface
